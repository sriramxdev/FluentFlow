name: Diagram self-healing pipeline
on:
  repository_dispatch:
    types: [synthesize-diagram]
  workflow_dispatch:
    inputs:
      specification:
        description: Path to a text specification
        required: true
        default: public/samples/microservices.mmd
jobs:
  synthesize:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.2
      - run: pixi install
      - run: pixi run pnpm install --frozen-lockfile
      - name: Synthesize and validate
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        run: pixi run synthesize "${{ inputs.specification || 'public/samples/microservices.mmd' }}"
      - uses: actions/upload-artifact@v4
        with: { name: verified-diagram, path: generated/diagram.mmd }
