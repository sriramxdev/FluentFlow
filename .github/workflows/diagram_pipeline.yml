name: Diagram self-healing pipeline

on:
  repository_dispatch:
    types: [synthesize-diagram]
  workflow_dispatch:
    inputs:
      specification:
        description: Path to a text specification
        required: true
        default: public/samples/microservices.mmd

jobs:
  synthesize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.2

      - name: Install Pixi environment
        run: pixi install

      - name: Install Node dependencies
        run: pixi run -- pnpm install --frozen-lockfile

      - name: Synthesize and validate
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        run: pixi run synthesize "${{ inputs.specification || 'public/samples/microservices.mmd' }}"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-diagram
          path: generated/diagram.mmd